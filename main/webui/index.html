<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N8-T Miner</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --border: #232838;
    --text: #e6e9f0; --dim: #8a91a5; --accent: #f7931a; --good: #3ecf8e; --bad: #ef4565;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.off { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .card .value.warn { color: var(--accent); }
  .card .value.bad { color: var(--bad); }
  .panel-title { font-size: 14px; font-weight: 600; color: var(--dim); margin: 28px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 5px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 10px; color: var(--text); font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { margin-top: 16px; background: var(--accent); color: #1a1200; border: none; border-radius: 6px;
    padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:hover { opacity: .9; }
  button.secondary { background: transparent; color: var(--dim); border: 1px solid var(--border); margin-left: 8px; }
  #saveMsg { font-size: 13px; color: var(--good); margin-top: 10px; display: none; }
  .overheat-banner { background: rgba(239,69,101,.12); border: 1px solid var(--bad); color: var(--bad);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span id="statusDot" class="dot"></span> N8-T Miner</h1>
  <div class="sub" id="subtitle">connecting…</div>

  <div class="overheat-banner" id="overheatBanner">⚠ Overheat protection is active — running reduced settings after a thermal event.</div>

  <div class="grid">
    <div class="card"><div class="label">Hashrate</div><div class="value" id="hashrate">–</div></div>
    <div class="card"><div class="label">ASIC Temp</div><div class="value" id="temp">–</div></div>
    <div class="card"><div class="label">VR Temp</div><div class="value" id="vrTemp">–</div></div>
    <div class="card"><div class="label">Fan</div><div class="value" id="fan">–</div></div>
    <div class="card"><div class="label">Power</div><div class="value" id="power">–</div></div>
    <div class="card"><div class="label">Frequency</div><div class="value" id="freq">–</div></div>
    <div class="card"><div class="label">Core Voltage</div><div class="value" id="coreV">–</div></div>
    <div class="card"><div class="label">Best Difficulty</div><div class="value" id="bestDiff">–</div></div>
    <div class="card"><div class="label">Shares (A/R)</div><div class="value" id="shares">–</div></div>
  </div>

  <div class="panel-title">Wi-Fi &amp; Pool Setup</div>
  <form id="cfgForm">
    <label>Wi-Fi network name</label>
    <input type="text" id="ssid" placeholder="Your home Wi-Fi" autocomplete="off">
    <label>Wi-Fi password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="off">
    <label>Pool host</label>
    <input type="text" id="poolHost" placeholder="e.g. vkbit.com" autocomplete="off">
    <label>Pool port</label>
    <input type="number" id="poolPort" placeholder="e.g. 3333" autocomplete="off">
    <label>Wallet address (stratum user)</label>
    <input type="text" id="poolUser" placeholder="bc1q…" autocomplete="off">
    <button type="submit">Save &amp; Restart</button>
    <button type="button" class="secondary" id="restartBtn">Restart only</button>
    <div id="saveMsg">Saved — restarting…</div>
  </form>
</div>

<script>
async function refresh() {
  try {
    const r = await fetch('/api/system/info');
    const d = await r.json();

    document.getElementById('statusDot').className = 'dot ' + (d.stratumConnected ? 'on' : 'off');
    document.getElementById('subtitle').textContent =
      d.wifiConnected ? ('online — ' + d.ipAddress) : 'not connected to Wi-Fi';

    document.getElementById('hashrate').textContent = (d.hashRate || 0).toFixed(1) + ' GH/s';
    const tempEl = document.getElementById('temp');
    tempEl.textContent = d.temp.toFixed(1) + ' °C';
    tempEl.className = 'value' + (d.temp > 75 ? ' warn' : '') + (d.temp > 90 ? ' bad' : '');
    document.getElementById('vrTemp').textContent = d.vrTemp.toFixed(1) + ' °C';
    document.getElementById('fan').textContent = Math.round(d.fanPercent) + '%';
    document.getElementById('power').textContent = d.power.toFixed(1) + ' W';
    document.getElementById('freq').textContent = d.frequency.toFixed(0) + ' MHz';
    document.getElementById('coreV').textContent = Math.round(d.coreVoltage) + ' mV';
    document.getElementById('bestDiff').textContent = formatDiff(d.bestDifficulty);
    document.getElementById('shares').textContent = d.sharesAccepted + ' / ' + d.sharesRejected;
    document.getElementById('overheatBanner').style.display = d.overheatMode ? 'block' : 'none';
  } catch (e) {
    document.getElementById('subtitle').textContent = 'unable to reach device';
    document.getElementById('statusDot').className = 'dot off';
  }
}

function formatDiff(v) {
  if (!v) return '–';
  if (v > 1e9) return (v / 1e9).toFixed(2) + 'G';
  if (v > 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v > 1e3) return (v / 1e3).toFixed(2) + 'K';
  return v.toFixed(0);
}

document.getElementById('cfgForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    ssid: document.getElementById('ssid').value,
    password: document.getElementById('password').value,
    poolHost: document.getElementById('poolHost').value,
    poolPort: parseInt(document.getElementById('poolPort').value || '0', 10),
    poolUser: document.getElementById('poolUser').value,
  };
  await fetch('/api/system', { method: 'POST', body: JSON.stringify(body) });
  document.getElementById('saveMsg').style.display = 'block';
});

document.getElementById('restartBtn').addEventListener('click', async () => {
  await fetch('/api/system/restart', { method: 'POST' });
});

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
